<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a5cff, #00c2cb);
            margin: 0;
            padding: 24px;
            min-height: 100vh;
        }

        .kotak {
            background: #fff;
            max-width: 560px;
            margin: 0 auto;
            padding: 24px 28px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
        }

        h3 { margin: 0 0 6px; color: #1f2a44; }
        hr { border: 0; height: 2px; background: #e3e7ff; margin: 16px 0; }

        p {
            margin: 0;
            padding: 10px 0;
            border-bottom: 1px dashed #d6dcff;
            color: #6b7794;
        }
        p:last-of-type { border-bottom: 0; }

        span { font-weight: bold; color: #1f2a44; }

        #negara    { color: #080808; }
        #provinsi  { color: #0d0d0d; }
        #kecamatan { color: #060606; }
        #longitude { color: #040404; }
        #latitude  { color: #080808; }
        #koordinat { color: #070707; }

        input {
            padding: 8px 10px;
            border: 2px solid #c9d1ff;
            border-radius: 8px;
        }
        button {
            padding: 8px 16px;
            border: 0;
            border-radius: 8px;
            background: #ff7a59;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #ff5c33; }

        #pesan { color: #d63a3a; font-weight: bold; border-bottom: 0; padding: 4px 0; }
        #pesan:empty { display: none; }
    </style>
</head>
<body>
    <div class="kotak">

        <h3>Nama : Sekar Kinasih</h3>
        <h3>NIM : 20240140243</h3>

        <hr>

        <p>
            Lokasi :
            <input type="text" id="input-lokasi" value="Bandung City" placeholder="Masukkan nama lokasi">
            <button id="btn-cari">Cari</button>
        </p>

        <p id="pesan"></p>

        <p>
            Kota :
            <span id="lokasi"></span>
        </p>

        <p>
            Koordinat :
            <span id="koordinat"></span>
        </p>

        <p>
        Negara :
        <span id="negara"></span>
        </p>

        <p>
        Provinsi :
        <span id="provinsi"></span>
        </p>

        <p>
        Kecamatan :
        <span id="kecamatan"></span>
        </p>

        <p>
        Longitude :
        <span id="longitude"></span>
        </p>

        <p>
        Latitude :
        <span id="latitude"></span>
        </p>

    </div>

    <script>
        function cariLokasi() {
            const q = document.getElementById("input-lokasi").value.trim();
            const pesan = document.getElementById("pesan");

            if (!q) {
                pesan.textContent = "Lokasi tidak boleh kosong";
                return;
            }
            pesan.textContent = "Mencari...";

            fetch("/api/lokasi?q=" + encodeURIComponent(q))
                .then(async response => {
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message);
                    return data;
                })
                .then(data => {
                    console.log(data);
                    document.getElementById("lokasi").innerHTML = data.kota;
                    document.getElementById("koordinat").innerHTML = data.koordinat.join(", ");
                    document.getElementById("negara").innerHTML = data.negara;
                    document.getElementById("provinsi").innerHTML = data.provinsi;
                    document.getElementById("kecamatan").innerHTML = data.kecamatan;
                    document.getElementById("longitude").innerHTML = data.longitude;
                    document.getElementById("latitude").innerHTML = data.latitude;
                    pesan.textContent = "";
                })
                .catch(error => {
                    console.error(error);
                    pesan.textContent = error.message;
                });
        }

        document.getElementById("btn-cari").addEventListener("click", cariLokasi);
        document.getElementById("input-lokasi").addEventListener("keydown", e => {
            if (e.key === "Enter") cariLokasi();
        });

        cariLokasi();
    </script>
</body>
</html>
