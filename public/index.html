<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation</title>
</head>
<body>
    <h3>Nama : Sekar Kinasih</h3>
    <h3>NIM : 20240140243</h3>

    <p>
        Kota : 
        <span id="lokasi"></span>
    </p>

    <hr>

    <p>
        Koordinat :
        <span id="negara"></span>
    </p>

    <p>
    Negara :
    <span id="negara"></span>
    </p>

    <p>
    Provinsi :
    <span id="provinsi"></span>
    </p>

    <p>
    Kecamatan :
    <span id="kecamatan"></span>
    </p>

    <p>
    Longitude :
    <span id="longitude"></span>
    </p>

    <p>
    Latitude :
    <span id="latitude"></span>
    </p>

    <script>
        fetch("/api/lokasi")
            .then(Response => Response.json())
            .then(data => {
                console.log(data);
                document.getElementById("lokasi").innerHTML = data.kota;
                document.getElementById("negara").innerHTML = 
                    data.koordinat;
            })
            .catch(error => {
                console.error(error);
            });
    </script>


</body>
</html>
